version: 2

project_name: pulumi-mailslurp

builds:
  - id: provider
    dir: provider
    main: ./cmd/pulumi-resource-mailslurp/
    binary: pulumi-resource-mailslurp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s
      - -w
      - -X github.com/jschady/pulumi-mailslurp/provider/pkg/version.Version={{.Tag}}

archives:
  - id: archive
    ids:
      - provider
    formats:
      - tar.gz
    name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"

changelog:
  disable: true

# A tag carrying a prerelease suffix reaches GitHub as a prerelease from this same config.
release:
  prerelease: auto
