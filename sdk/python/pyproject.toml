[project]
  name = "pulumi_mailslurp"
  description = "A Pulumi provider that creates and manages MailSlurp email infrastructure."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "mailslurp", "email", "category/utility", "kind/native"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.0.0"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://www.mailslurp.com"
    Repository = "https://github.com/jschady/pulumi-mailslurp"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_mailslurp = ["py.typed", "pulumi-plugin.json"]
