name: mailslurp-inbox
runtime: yaml
description: One MailSlurp inbox, with the address the account assigns it.

# MailSlurp bills every created inbox and burns a rolling quota that a delete does not refund, so
# this is the only example program that creates one.
config:
  inboxName:
    type: string

resources:
  exampleInbox:
    type: mailslurp:index:Inbox
    properties:
      name: ${inboxName}
      description: The inbox this program creates
      inboxType: HTTP_INBOX
      tags:
        - example

outputs:
  inboxId: ${exampleInbox.id}
  emailAddress: ${exampleInbox.emailAddress}
