name: mailslurp-examples
runtime: yaml
description: Every resource and every function of the MailSlurp provider in one program.

# The provider reads the API key from MAILSLURP_API_KEY, so no program here carries one.
config:
  inboxName:
    type: string
  webhookName:
    type: string
  webhookUrl:
    type: string
  rulesetTarget:
    type: string
  templateName:
    type: string
  forwarderRecipient:
    type: string
  domainId:
    type: string

resources:
  exampleInbox:
    type: mailslurp:index:Inbox
    properties:
      name: ${inboxName}
      description: The inbox this program creates
      inboxType: HTTP_INBOX
      tags:
        - example

  exampleWebhook:
    type: mailslurp:index:Webhook
    properties:
      name: ${webhookName}
      inboxId: ${exampleInbox.id}
      url: ${webhookUrl}
      eventName: NEW_EMAIL

  exampleRuleset:
    type: mailslurp:index:InboxRuleset
    properties:
      inboxId: ${exampleInbox.id}
      scope: RECEIVING_EMAILS
      action: BLOCK
      target: ${rulesetTarget}

  exampleTemplate:
    type: mailslurp:index:EmailTemplate
    properties:
      name: ${templateName}
      content: |
        Hello {{firstName}},
        Your inbox {{inboxAddress}} is ready.

  exampleForwarder:
    type: mailslurp:index:InboxForwarder
    properties:
      inboxId: ${exampleInbox.id}
      field: SUBJECT
      should: CONTAIN
      match: invoice
      forwardToRecipients:
        - ${forwarderRecipient}

variables:
  readInbox:
    fn::invoke:
      function: mailslurp:index:getInbox
      arguments:
        inboxId: ${exampleInbox.id}

  readDomain:
    fn::invoke:
      function: mailslurp:index:getDomain
      arguments:
        domainId: ${domainId}

outputs:
  emailAddress: ${readInbox.emailAddress}
  webhookId: ${exampleWebhook.id}
  rulesetId: ${exampleRuleset.id}
  templateVariables: ${exampleTemplate.variables}
  forwarderId: ${exampleForwarder.id}
  domainName: ${readDomain.domain}
