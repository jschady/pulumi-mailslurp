name: mailslurp-email-template
description: A template that MailSlurp fills with two variables
runtime: yaml
resources:
  welcome-template:
    type: mailslurp:index:EmailTemplate
    properties:
      name: welcome-template
      content: |
        Hello {{firstName}},
        Your inbox {{inboxAddress}} is ready.
outputs:
  variables: ${welcome-template.variables}
