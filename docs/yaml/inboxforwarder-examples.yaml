name: mailslurp-inbox-forwarder
description: A forwarder that sends every invoice email to the billing address
runtime: yaml
resources:
  billing-inbox:
    type: mailslurp:index:Inbox
    properties:
      name: billing-inbox
  invoice-forwarder:
    type: mailslurp:index:InboxForwarder
    properties:
      inboxId: ${billing-inbox.id}
      field: SUBJECT
      should: CONTAIN
      match: invoice
      forwardToRecipients:
        - billing@example.com
outputs:
  forwarderId: ${invoice-forwarder.id}
