name: mailslurp-webhook
description: A webhook that posts every new email of one inbox to your server
runtime: yaml
resources:
  alert-inbox:
    type: mailslurp:index:Inbox
    properties:
      name: alert-inbox
  new-email-hook:
    type: mailslurp:index:Webhook
    properties:
      name: new-email-hook
      inboxId: ${alert-inbox.id}
      url: https://example.com/mailslurp/new-email
      eventName: NEW_EMAIL
outputs:
  webhookId: ${new-email-hook.id}
