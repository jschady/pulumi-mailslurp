name: pull-request

on:
  pull_request:
    # labeled joins the defaults so that adding run-live-tests starts a run by itself.
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PACK: mailslurp
  PROVIDER: pulumi-resource-mailslurp
  PULUMI_VERSION: 3.258.0
  PULUMICTL_VERSION: v0.0.50
  GOLANGCI_LINT_VERSION: v2.12.2
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  NODE_VERSION: 24.x
  YARN_VERSION: 1.22.22
  PYTHON_VERSION: '3.11'
  DOTNET_VERSION: 8.0.x
  PULUMI_BACKEND_URL: file://~
  PULUMI_CONFIG_PASSPHRASE: ci-local-passphrase
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PULUMI_IGNORE_AMBIENT_PLUGINS: 'true'
  PULUMI_DISABLE_AUTOMATIC_PLUGIN_ACQUISITION: 'true'

jobs:
  prerequisites:
    name: prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the Pulumi CLI and pulumictl
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pulumi/pulumi" version | grep -qx "v${PULUMI_VERSION}"
          echo "$RUNNER_TEMP/pulumi" >>"$GITHUB_PATH"
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Set the provider version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate the schema
        run: make generate_schema
      - name: Check the worktree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "The generated schema differs from the committed one. Run make generate_schema and commit the result."
            exit 1
          fi
      - name: Build the provider
        run: make provider
      - name: Pack the provider binary
        run: tar -czf provider.tar.gz -C bin "$PROVIDER"
      - name: Upload the provider binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: provider.tar.gz
          path: provider.tar.gz

  build_sdks:
    name: build_sdks
    needs: prerequisites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [nodejs, python, dotnet, go]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node
        if: matrix.language == 'nodejs'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Yarn
        if: matrix.language == 'nodejs'
        run: npm install -g "yarn@${YARN_VERSION}"
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the Python build tools
        if: matrix.language == 'python'
        run: python -m pip install 'build>=1.2' 'twine==6.1.0'
      - name: Set up .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install the Pulumi CLI and pulumictl
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pulumi/pulumi" version | grep -qx "v${PULUMI_VERSION}"
          echo "$RUNNER_TEMP/pulumi" >>"$GITHUB_PATH"
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Set the provider version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate the SDK
        run: make generate_${{ matrix.language }}
      - name: Build the SDK
        run: make build_${{ matrix.language }}
      - name: Check the worktree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "The generated ${{ matrix.language }} SDK differs from the committed one. Run make generate_${{ matrix.language }} and commit the result."
            exit 1
          fi
      - name: Pack the SDK
        run: tar -czf ${{ matrix.language }}-sdk.tar.gz -C sdk/${{ matrix.language }} .
      - name: Upload the SDK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: ${{ matrix.language }}-sdk.tar.gz

  compile_examples:
    name: compile_examples
    needs: build_sdks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Yarn
        run: npm install -g "yarn@${YARN_VERSION}"
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the Python build tools
        run: python -m pip install 'build>=1.2' 'twine==6.1.0'
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install the Pulumi CLI and pulumictl
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pulumi/pulumi" version | grep -qx "v${PULUMI_VERSION}"
          echo "$RUNNER_TEMP/pulumi" >>"$GITHUB_PATH"
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Build the 4 SDKs
        run: make sdk
      - name: Compile the example programs
        run: make compile_examples

  examples:
    name: examples
    needs: prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the Pulumi CLI and pulumictl
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pulumi/pulumi" version | grep -qx "v${PULUMI_VERSION}"
          echo "$RUNNER_TEMP/pulumi" >>"$GITHUB_PATH"
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Convert the example programs
        run: make examples
      - name: Check the worktree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "The converted example programs differ from the committed ones. Run make examples and commit the result."
            exit 1
          fi
      - name: Run the example tests that read no credential
        env:
          PULUMI_HOME: ${{ github.workspace }}/.pulumi
        run: go test -count=1 ./examples/...

  test_examples:
    name: test_examples
    needs: compile_examples
    runs-on: ubuntu-latest
    # A pull request reaches the account only from this repository and only under the label. A
    # fork pull request runs the acceptance tests through /run-acceptance-tests instead.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-live-tests'))
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Yarn
        run: npm install -g "yarn@${YARN_VERSION}"
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the Python build tools
        run: python -m pip install 'build>=1.2' 'twine==6.1.0'
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install the Pulumi CLI and pulumictl
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pulumi/pulumi" version | grep -qx "v${PULUMI_VERSION}"
          echo "$RUNNER_TEMP/pulumi" >>"$GITHUB_PATH"
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Download the provider binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: provider.tar.gz
      - name: Unpack the provider binary
        run: |
          mkdir -p bin
          tar -xzf provider.tar.gz -C bin
          rm provider.tar.gz
          chmod +x "bin/$PROVIDER"
          echo "${{ github.workspace }}/bin" >>"$GITHUB_PATH"
      - name: Build the 4 SDKs
        run: make sdk
      - name: Run the example programs
        env:
          MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
          # Empty until a release exists, and the upgrade test skips while it is.
          UPGRADE_BASELINE_VERSION: ${{ vars.UPGRADE_BASELINE_VERSION }}
        run: make test_examples

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint and pulumictl
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
          golangci-lint --version
      - name: Install actionlint
        run: |
          bin="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $bin/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$bin/actionlint.tar.gz" -C "$bin" actionlint
          echo "$bin" >>"$GITHUB_PATH"
          "$bin/actionlint" --version
      - name: Check the workflow rules
        run: ./.github/workflows/check-workflows.sh
      - name: Check the internal references
        run: ./scripts/check-internal-references.sh
      - name: Lint the Go code
        run: make lint
      - name: Lint the prose
        run: make lint_prose

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pulumictl
        run: go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Install actionlint
        run: |
          bin="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $bin/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$bin/actionlint.tar.gz" -C "$bin" actionlint
          echo "$bin" >>"$GITHUB_PATH"
          "$bin/actionlint" --version
      - name: Run the unit tests
        run: make test_provider GOTEST='go test -coverprofile=coverage.txt -covermode=atomic'
      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage.txt
          path: coverage.txt

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    # A pull request reaches the account only from this repository and only under the label. A
    # fork pull request runs the acceptance tests through /run-acceptance-tests instead.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-live-tests'))
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pulumictl
        run: go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Install actionlint
        run: |
          bin="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $bin/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$bin/actionlint.tar.gz" -C "$bin" actionlint
          echo "$bin" >>"$GITHUB_PATH"
          "$bin/actionlint" --version
      - name: List the tests that the integration tag adds
        run: |
          go test -tags=integration -list '.*' ./provider/... | grep '^Test' | sort >"$RUNNER_TEMP/tagged.txt"
          go test -list '.*' ./provider/... | grep '^Test' | sort >"$RUNNER_TEMP/untagged.txt"
          comm -13 "$RUNNER_TEMP/untagged.txt" "$RUNNER_TEMP/tagged.txt" >"$RUNNER_TEMP/integration-tests.txt"
          if [ ! -s "$RUNNER_TEMP/integration-tests.txt" ]; then
            echo "No file carries the integration build tag, so make test_integration passes without a vendor call. Add a tagged test."
            exit 1
          fi
          cat "$RUNNER_TEMP/integration-tests.txt"
      - name: Run the integration tests
        shell: bash
        env:
          MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
        run: make test_integration GOTEST='go test -v' | tee "$RUNNER_TEMP/integration.log"
      - name: Confirm every integration test started
        run: ./scripts/check-tests-ran.sh "$RUNNER_TEMP/integration-tests.txt" "$RUNNER_TEMP/integration.log"

  sentinel:
    name: sentinel
    runs-on: ubuntu-latest
    needs:
      - prerequisites
      - build_sdks
      - compile_examples
      - examples
      - test_examples
      - lint
      - unit
      - integration
    if: always()
    steps:
      - name: Confirm every job passed or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A job in this workflow reported $result. Read the job log. Fix the failure."
                exit 1
                ;;
            esac
          done
