name: acceptance-tests

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

env:
  PACK: mailslurp
  PROVIDER: pulumi-resource-mailslurp
  PULUMI_VERSION: 3.258.0
  PULUMICTL_VERSION: v0.0.50
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  NODE_VERSION: 24.x
  YARN_VERSION: 1.22.22
  PYTHON_VERSION: '3.11'
  DOTNET_VERSION: 8.0.x
  PULUMI_BACKEND_URL: file://~
  PULUMI_CONFIG_PASSPHRASE: ci-local-passphrase
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PULUMI_IGNORE_AMBIENT_PLUGINS: 'true'
  PULUMI_DISABLE_AUTOMATIC_PLUGIN_ACQUISITION: 'true'

jobs:
  authorize:
    name: authorize
    runs-on: ubuntu-latest
    # A comment on an issue is not a command, and the three associations below are the ones GitHub
    # reports for an account with write access to this repository.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/run-acceptance-tests') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: read
      pull-requests: write
    outputs:
      head_sha: ${{ steps.pin.outputs.head_sha }}
    steps:
      - name: Pin the commit the command reads
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_sha="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ -z "$head_sha" ]; then
            echo "Pull request $PR_NUMBER reports no head commit. Nothing ran."
            exit 1
          fi
          echo "head_sha=$head_sha" >>"$GITHUB_OUTPUT"
      - name: Report the commit the run reads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pin.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" \
            --body "The acceptance tests run at commit $HEAD_SHA. Read the run at $RUN_URL."

  acceptance_tests:
    name: acceptance_tests
    needs: authorize
    runs-on: ubuntu-latest
    env:
      MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
    steps:
      # A maintainer asked for this run, so the credentials are meant to be present. A suite that
      # skipped itself for a missing key would report a pass nobody earned.
      - name: Refuse a missing API key
        run: |
          if [ -z "$MAILSLURP_API_KEY" ]; then
            echo "The repository holds no MAILSLURP_API_KEY secret. Add the secret, then run the command again."
            exit 1
          fi
      # Authorization is judged when the authorize job reads the head SHA. Checking that commit
      # out, rather than a branch name, keeps a later push out of this run.
      - name: Check out the commit the command pinned
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Yarn
        run: npm install -g "yarn@${YARN_VERSION}"
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the Python build tools
        run: python -m pip install 'build>=1.2' 'twine==6.1.0'
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install the Pulumi CLI and pulumictl
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pulumi/pulumi" version | grep -qx "v${PULUMI_VERSION}"
          echo "$RUNNER_TEMP/pulumi" >>"$GITHUB_PATH"
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Install actionlint
        run: |
          bin="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $bin/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$bin/actionlint.tar.gz" -C "$bin" actionlint
          echo "$bin" >>"$GITHUB_PATH"
          "$bin/actionlint" --version
      - name: Set the provider version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the provider
        run: |
          make provider
          echo "${{ github.workspace }}/bin" >>"$GITHUB_PATH"
      - name: Build the 4 SDKs
        run: make sdk
      - name: List the tests that the integration tag adds
        run: |
          go test -tags=integration -list '.*' ./provider/... | grep '^Test' | sort >"$RUNNER_TEMP/tagged.txt"
          go test -list '.*' ./provider/... | grep '^Test' | sort >"$RUNNER_TEMP/untagged.txt"
          comm -13 "$RUNNER_TEMP/untagged.txt" "$RUNNER_TEMP/tagged.txt" >"$RUNNER_TEMP/integration-tests.txt"
          cat "$RUNNER_TEMP/integration-tests.txt"
      - name: Run the integration tests
        shell: bash
        run: make test_integration GOTEST='go test -v' | tee "$RUNNER_TEMP/integration.log"
      - name: Confirm every integration test started
        run: ./scripts/check-tests-ran.sh "$RUNNER_TEMP/integration-tests.txt" "$RUNNER_TEMP/integration.log"
      - name: Run the example programs
        env:
          # Empty until a release exists, and the upgrade test skips while it is.
          UPGRADE_BASELINE_VERSION: ${{ vars.UPGRADE_BASELINE_VERSION }}
        run: make test_examples
