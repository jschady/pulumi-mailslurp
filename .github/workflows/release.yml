name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  PACK: mailslurp
  PROVIDER: pulumi-resource-mailslurp
  PULUMI_VERSION: 3.258.0
  PULUMICTL_VERSION: v0.0.50
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  GORELEASER_VERSION: "~> v2"
  NODE_VERSION: 24.x
  YARN_VERSION: 1.22.22
  PYTHON_VERSION: '3.11'
  DOTNET_VERSION: 8.0.x
  PULUMI_BACKEND_URL: file://~
  PULUMI_CONFIG_PASSPHRASE: ci-local-passphrase
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PULUMI_IGNORE_AMBIENT_PLUGINS: 'true'
  PULUMI_DISABLE_AUTOMATIC_PLUGIN_ACQUISITION: 'true'

jobs:
  prerequisites:
    name: prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the Pulumi CLI and pulumictl
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pulumi/pulumi" version | grep -qx "v${PULUMI_VERSION}"
          echo "$RUNNER_TEMP/pulumi" >>"$GITHUB_PATH"
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Set the provider version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate the schema
        run: make generate_schema
      - name: Check the worktree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "The generated schema differs from the committed one. Run make generate_schema and commit the result."
            exit 1
          fi
      - name: Build the provider
        run: make provider
      - name: Pack the provider binary
        run: tar -czf provider.tar.gz -C bin "$PROVIDER"
      - name: Upload the provider binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: provider.tar.gz
          path: provider.tar.gz

  build_sdks:
    name: build_sdks
    needs: prerequisites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        language: [nodejs, python, dotnet, go]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node
        if: matrix.language == 'nodejs'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Yarn
        if: matrix.language == 'nodejs'
        run: npm install -g "yarn@${YARN_VERSION}"
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the Python build tools
        if: matrix.language == 'python'
        run: python -m pip install 'build>=1.2' 'twine==6.1.0'
      - name: Set up .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install the Pulumi CLI and pulumictl
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pulumi/pulumi" version | grep -qx "v${PULUMI_VERSION}"
          echo "$RUNNER_TEMP/pulumi" >>"$GITHUB_PATH"
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Set the provider version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate the SDK
        run: make generate_${{ matrix.language }}
      - name: Build the SDK
        run: make build_${{ matrix.language }}
      - name: Check the worktree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "The generated ${{ matrix.language }} SDK differs from the committed one. Run make generate_${{ matrix.language }} and commit the result."
            exit 1
          fi
      - name: Pack the SDK
        run: tar -czf ${{ matrix.language }}-sdk.tar.gz -C sdk/${{ matrix.language }} .
      - name: Upload the SDK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: ${{ matrix.language }}-sdk.tar.gz

  unit:
    name: unit
    needs: build_sdks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pulumictl
        run: go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Install actionlint
        run: |
          bin="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $bin/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$bin/actionlint.tar.gz" -C "$bin" actionlint
          echo "$bin" >>"$GITHUB_PATH"
          "$bin/actionlint" --version
      - name: Run the unit tests
        run: make test_provider

  # The SDK set is confirmed before any binary publishes. A release page carrying binaries that
  # no SDK can be published against is a release nobody can consume.
  confirm_sdks:
    name: confirm_sdks
    needs: build_sdks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pulumictl
        run: go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Set the provider version
        id: version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download every SDK
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*-sdk.tar.gz'
          path: sdk-artifacts
      - name: Unpack the 4 SDKs
        run: |
          for language in nodejs python dotnet go; do
            mkdir -p "sdk-set/$language"
            tar -xzf "sdk-artifacts/$language-sdk.tar.gz/$language-sdk.tar.gz" -C "sdk-set/$language"
          done
      - name: Confirm the SDK set
        run: ./scripts/check-sdk-artifacts.sh sdk-set "${{ steps.version.outputs.version }}"

  publish_provider:
    name: publish_provider
    needs:
      - unit
      - confirm_sdks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pulumictl
        run: go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
      - name: Set the provider version
        id: version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The six cross-compiled builds can outgrow the runner's free disk; the preinstalled
      # toolchains this job never touches make the room.
      - name: Free the runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Publish the provider binaries
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --timeout 60m0s --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}

  publish_sdks:
    name: publish_sdks
    needs: publish_provider
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Download the nodejs SDK
        uses: actions/download-artifact@v8.0.1
        with:
          name: nodejs-sdk.tar.gz
      - name: Download the python SDK
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-sdk.tar.gz
      - name: Download the dotnet SDK
        uses: actions/download-artifact@v8.0.1
        with:
          name: dotnet-sdk.tar.gz
      - name: Unpack the SDKs
        run: |
          for language in nodejs python dotnet; do
            mkdir -p "sdk/$language"
            tar -xzf "$language-sdk.tar.gz" -C "sdk/$language"
            rm "$language-sdk.tar.gz"
          done
      - name: Publish the nodejs SDK to npm
        working-directory: sdk/nodejs/bin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(jq -r .version package.json)"
          case "$version" in
            *-alpha* | *-dev*) tag=dev ;;
            *-beta*) tag=beta ;;
            *-rc*) tag=rc ;;
            *-*) tag=dev ;;
            *) tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$tag"
      - name: Publish the python SDK to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: sdk/python/bin/dist
      # The exchange answers a key that lives one hour, so it runs right before the push.
      - name: Exchange the workflow identity for a NuGet API key
        id: nuget_login
        uses: NuGet/login@v1.2.0
        with:
          user: jschady
      # A find -exec ';' reports success whatever the push answers, so the push names its file.
      - name: Publish the dotnet SDK to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "sdk/dotnet/bin/Debug/*.nupkg" -k "$NUGET_API_KEY" \
            -s https://api.nuget.org/v3/index.json

  publish_go_sdk:
    name: publish_go_sdk
    needs: publish_sdks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set the provider version
        id: version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the go SDK
        uses: actions/download-artifact@v8.0.1
        with:
          name: go-sdk.tar.gz
      - name: Unpack the go SDK
        run: |
          mkdir -p sdk/go
          tar -xzf go-sdk.tar.gz -C sdk/go
          rm go-sdk.tar.gz
      - name: Publish the go SDK
        uses: pulumi/publish-go-sdk-action@v1.2.0
        with:
          repository: ${{ github.repository }}
          base-ref: ${{ github.sha }}
          source: sdk/go/${{ env.PACK }}
          path: sdk/go/${{ env.PACK }}
          version: ${{ steps.version.outputs.version }}
          additive: false
