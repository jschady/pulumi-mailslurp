name: spec-drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  spec_diff:
    name: spec_diff
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Fetch the live spec
        env:
          SPEC_URL: https://api.mailslurp.com/v2/api-docs
        run: curl -fsSL --retry 3 --retry-delay 5 "$SPEC_URL" -o "$RUNNER_TEMP/live-openapi.json"
      - name: Compare the path sets
        env:
          PINNED_SPEC: api/openapi.json
          LIVE_SPEC: ${{ runner.temp }}/live-openapi.json
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          jq -r '.paths | keys[]' "$PINNED_SPEC" | sort >"$work/pinned"
          jq -r '.paths | keys[]' "$LIVE_SPEC" | sort >"$work/live"
          gone="$(comm -23 "$work/pinned" "$work/live")"
          added="$(comm -13 "$work/pinned" "$work/live")"
          if [ -z "$gone" ] && [ -z "$added" ]; then
            echo "Both specs serve the same $(wc -l <"$work/pinned" | tr -d ' ') paths."
            exit 0
          fi
          if [ -n "$gone" ]; then
            echo "MailSlurp dropped these paths:"
            echo "$gone"
          fi
          if [ -n "$added" ]; then
            echo "MailSlurp added these paths:"
            echo "$added"
          fi
          echo "Pin the new spec in api/openapi.json. Read the client again for the paths that moved."
          exit 1
